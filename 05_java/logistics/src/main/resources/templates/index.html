<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 과일 트레드밀 객체탐지 관제 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23212529'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='bold' font-size='50'>AI</text></svg>">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .preview-img { max-width: 100%; max-height: 400px; border-radius: 8px; object-fit: contain; }
        .stream-box { width: 100%; max-width: 720px; min-height: 400px; background-color: #000; border-radius: 8px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid container">
        <span class="navbar-brand mb-0 h1">🍎 🍊 🍌 탐지 모델</span>
    </div>
</nav>

<div class="container my-4">
    <ul class="nav nav-pills nav-fill mb-4" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fs-5" id="tab-video-btn" data-bs-toggle="pill" data-bs-target="#tab-video" type="button" role="tab">🎬 트레드밀 동영상 실시간 탐지</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fs-5" id="tab-image-btn" data-bs-toggle="pill" data-bs-target="#tab-image" type="button" role="tab">📸 이미지 단건 탐지</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fs-5" id="tab-history-btn" data-bs-toggle="pill" data-bs-target="#tab-history" type="button" role="tab" onclick="loadHistories()">📜 탐지 이력 확인</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">

        <!-- 1. 비디오 탐지 탭 -->
        <div class="tab-pane fade show active" id="tab-video" role="tabpanel">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card p-4">
                        <h5 class="card-title mb-3">📹 영상 파일 업로드</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted fs-7">컨베이어/트레드밀 영상 (.mp4)</label>
                            <input class="form-control" type="file" id="videoInput" accept="video/*" required>
                            <!-- 원본 비디오 (숨김 처리 및 음소거) -->
                            <video id="videoElement" muted style="display: none;"></video>
                        </div>
                        <button class="btn btn-primary w-100 py-2" id="videoSubmitBtn">
                            🚀 영상 업로드 및 AI 탐지 시작
                        </button>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card p-4 text-center">
                        <h5 class="card-title mb-3">실시간 YOLOv8 객체 탐지 프레임</h5>
                        <div class="d-flex justify-content-center">
                            <div id="resultContainer" style="text-align: center;">
                                <p id="clickGuide" class="text-muted fs-7 d-none">👇 이미지를 클릭하면 일시정지 / 다시재생 됩니다.</p>
                                <p id="fpsCounter" class="text-muted fs-7">FPS: --</p>
                                <!-- 탐지 결과 스트리밍 이미지 -->
                                <img id="resultFrame"
                                     style="cursor: pointer; max-width: 100%; border: 2px solid #333; border-radius: 8px; display: none;"
                                     alt="Object Detection Stream" />
                                <!-- 프레임 추출용 Canvas (화면 가림) -->
                                <canvas id="canvasElement" style="display:none;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 이미지 단건 탐지 탭 -->
        <div class="tab-pane fade" id="tab-image" role="tabpanel">
            <div class="row g-4">
                <div class="col-md-5">
                    <div class="card p-4">
                        <h5 class="card-title mb-3">이미지 파일 업로드</h5>
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label class="form-label text-muted fs-7">확신도 임계값: <span id="conf_value">0.5</span></label>
                                <input type="range" class="form-range mb-3" id="conf_threshold" min="0" max="100" value="50" oninput="updateConf(this.value)">

                                <label class="form-label text-muted fs-7">IoU 임계값: <span id="iou_value">0.5</span></label>
                                <input type="range" class="form-range mb-3" id="iou_threshold" min="0" max="100" value="50" oninput="updateIoU(this.value)">

                                <input class="form-control" type="file" id="imageInput" accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">
                                🚀 AI 탐지 실행하기
                            </button>
                        </form>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="card p-4">
                        <h5 class="card-title mb-3">탐지 결과</h5>
                        <div class="text-center min-vh-25 bg-light d-flex align-items-center justify-content-center p-3 rounded">
                            <img id="resultImage" class="preview-img d-none" alt="Detection Result">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 이력 조회 탭 -->
        <div class="tab-pane fade" id="tab-history" role="tabpanel">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">데이터베이스 탐지 이력</h5>
                    <button class="btn btn-outline-secondary btn-sm" onclick="loadHistories()">🔄 새로고침</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>원본 파일명</th>
                            <th>탐지 과일</th>
                            <th>확신도</th>
                            <th>좌표</th>
                            <th>확신도 임계값</th>
                            <th>IoU 임계값</th>
                            <th>탐지 시각</th>
                            <th>결과 이미지</th>
                        </tr>
                        </thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Elements
    const videoInput = document.getElementById('videoInput');
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const ctx = canvas.getContext('2d');
    const resultFrame = document.getElementById('resultFrame');
    const submitBtn = document.getElementById('videoSubmitBtn');
    const clickGuide = document.getElementById('clickGuide');

    // 비디오 음소거
    video.muted = true;

    // WebSocket 연결 (현재 도메인 자동 추출)
    const host = window.location.hostname;
    const socket = new WebSocket(`ws://${host}:8000/ws/detect`);
    socket.binaryType = 'blob'; // 수신 데이터 타입을 blob으로 지정

    let currentBlobUrl = null;// 메모리 관리를 위한 전역 변수

    const fpsCounter = document.getElementById('fpsCounter');
    let lastCalledTime = performance.now(); // FPS 계산용 이전 시간 저장

    socket.onopen = () => console.log('WebSocket 연결 성공');

    // 비디오 파일 선택 시 원본 연결
    videoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
        }
    });

    // [제출/시작] 버튼 클릭 시
    submitBtn.addEventListener('click', () => {
        if (!video.src) {
            alert('동영상을 먼저 선택해 주세요');
            return;
        }

        resultFrame.style.display = 'inline-block';
        clickGuide.classList.remove('d-none');

        // 재생 시작 (play 이벤트가 트리거되면서 웹소켓 전송 시작)
        video.play();
    });

    // ✨ 결과 이미지 클릭 시 일시정지 / 다시 재생 토글
    resultFrame.addEventListener('click', () => {
        if (video.paused) {
            video.play();
            console.log('영상 재생');
        } else {
            video.pause();
            console.log('영상 일시정지');
        }
    });

    // 비디오 재생 중 프레임 추출 및 전송 루프
    video.addEventListener('play', () => {
        // 현재 프레임 처리가 완료되었는지 확인하는 플래그
        let isProcessing = false;

        function sendNextFrame() {
            // 일시정지, 종료되었거나 이미 처리 중인 프레임이 있다면 대기
            if (video.paused || video.ended || isProcessing) return;

            canvas.width = 480;
            canvas.height = 270;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                if (blob && socket.readyState === WebSocket.OPEN) {
                    isProcessing = true; // 서버 응답이 올때까지 Lock을 겁니다.
                    socket.send(blob);
                }
            }, 'image/jpeg', 0.4);
        }

        // 서버로부터 추론 완료 프레임을 받았을 때의 이벤트 수정
        socket.onmessage = (event) => {
            // 화면 즉시 갱신 (메모리 해제 포함)
            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            currentBlobUrl = URL.createObjectURL(event.data);
            resultFrame.src = currentBlobUrl;

            // 실시간 FPS 계산 로직
            const delta = (performance.now() - lastCalledTime) / 1000; // 지난 시간을 초 단위로 변환
            lastCalledTime = performance.now();
            const currentFps = Math.round(1 / delta); // 1초 나누기 걸린 시간 = FPS

            fpsCounter.innerText = `FPS: ${currentFps}`;

            // 락을 해제하고 바로 다음 프레임을 전송 요청
            isProcessing = false;

            // 아주 미세한 텀(예: 10ms)을 주거나 즉시 다음 프레임 전송
            setTimeout(sendNextFrame, 10);
        };

        // 최초 재생 시작 시 첫 프레임을 트리거
        sendNextFrame();
    });

    // --- 2. 이미지 단건 탐지 ---
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('imageInput');
        if (fileInput.files.length === 0) return;

        const conf_threshold = document.getElementById('conf_threshold');
        const conf_value = Number(conf_threshold.value) / 100;
        const iou_threshold = document.getElementById('iou_threshold');
        const iou_value = Number(iou_threshold.value) / 100;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('conf_value', conf_value.toString());
        formData.append('iou_value', iou_value.toString());

        try {
            const response = await fetch('/api/v1/detection/detect', { method: 'POST', body: formData });
            const data = await response.json();
            if (data.status === 'SUCCESS') {
                const img = document.getElementById('resultImage');
                img.src = 'data:image/jpeg;base64,' + data.result_image_base64;
                img.classList.remove('d-none');
            }
        } catch (e) { alert('오류 발생'); }
    });

    // --- 3. DB 이력 조회 ---
    async function loadHistories() {
        const tbody = document.getElementById('historyTableBody');
        try {
            const response = await fetch('/api/v1/detection/histories');
            const histories = await response.json();
            tbody.innerHTML = '';
            histories.forEach(h => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${h.id}</td>
                    <td>${h.originalFileName}</td>
                    <td><span class="badge bg-success">${h.detectedFruit}</span></td>
                    <td>${(h.confidence * 100).toFixed(1)}%</td>
                    <td>${h.bboxCoordinates}</td>
                    <td>${(h.conf_threshold * 100).toFixed(1)}%</td>
                    <td>${(h.iou_threshold * 100).toFixed(1)}%</td>
                    <td>${h.createdDate ? h.createdDate.replace('T', ' ').substring(0, 19) : '-'}</td>
                    <td><a href="/images/${h.savedFileName}" target="_blank" class="btn btn-sm btn-outline-primary">🖼️ 이미지</a></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) { console.error(e); }
    }

    function updateConf(val) {
        document.getElementById('conf_value').innerText = Number(val) / 100;
    }

    function updateIoU(val) {
        document.getElementById('iou_value').innerText = Number(val) / 100;
    }
</script>
</body>
</html>
